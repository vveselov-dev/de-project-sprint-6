
services:
  metabase:
    image: metabase/metabase
    ports:
      - "3335:3000"
    volumes:
      - ./plugins/:/plugins
      - ./data:/data

  de-sprint-6:
    image: cr.yandex/crp1r8pht0n0gl25aug1/de-sprint-6:v2024-01-25r2
    ports:
      - "3001:3000"
      - "3003:3002"
      - "15433:5432"
    environment:
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
      VERTICA_PASSWORD: ${VERTICA_PASSWORD}
    volumes:
      - mydb:/var/lib/postgresql
      - mylessons:/lessons
      - ./dags:/lessons/dags
      - ./data:/data


volumes:
  mydb:
  mylessons:
